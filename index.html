<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube</title>
    <link href="//www.gstatic.com/images/branding/searchlogo/ico/favicon.ico" rel="icon">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"/>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css"/>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"/>
    <link rel="shortcut icon" href="https://www.youtube.com/s/desktop/5a9b4a4e/img/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <nav>

        <div class="one">
            <div class="three-lines">
                <i class="ph ph-list"></i>
            </div>

            <div class="logo">
                <a href="#">
                    <svg width="29" height="20" viewBox="0 0 29 20">
                        <g>
                            <rect x="0" y="0" width="29" height="20" rx="5" ry="5" fill="#FF0033"/>
                            <path d="M19 10 L11.5 5.75 V14.25 L19 10 Z" fill="white"/>
                        </g>
                    </svg> 
                    <span>YouTube <sup>NP</sup></span>
                </a>
            </div>
        </div>


        <div class="two">
            <div class="searchbar">

                <div class="search">
                    <textarea></textarea>
                </div>

                <div class="search-icon">
                    <i class="ph-bold ph-magnifying-glass"></i>
                </div>

            </div>

            <div class="voice-search">
                <i class="ph-bold ph-microphone"></i>
            </div>
        </div>


        <div class="three">
            <div class="create">
                <i class="ph-bold ph-plus"></i>
                <span>Create</span>
            </div>

            <div class="notifications">
                <i class="ph-bold ph-bell"></i>
            </div>

            <div class="profile">
                <img src="" alt="profile">
            </div>
        </div>


    </nav>

</body>
</html>
